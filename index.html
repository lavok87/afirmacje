<title>Афірмації</title>

<style>
/* Layout: one-screen phone app, content column up to 520px, bottom tab bar; each theme tints the whole screen */
:root {
  --bg: #fbf3ef;
  --surface: rgba(255,255,255,.72);
  --surface-solid: #fffaf7;
  --ink: #57373d;
  --ink-soft: #8d6c71;
  --line: rgba(87,55,61,.12);
  --rose: #c96f80;
  --rose-ink: #ffffff;
  --shadow: rgba(150,80,90,.16);
  --font-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-body: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 26px;
  --confidence-1: #FDE8D2; --confidence-2: #F5BFA8; --confidence-a: #B8664A;
  --productivity-1: #FBF1DC; --productivity-2: #EDCBA4; --productivity-a: #946B40;
  --mindfulness-1: #E8F2E6; --mindfulness-2: #BFD9C5; --mindfulness-a: #55866A;
  --selfLove-1: #FCE1E4; --selfLove-2: #F2AFBC; --selfLove-a: #B85A70;
  --motivation-1: #FDE4D6; --motivation-2: #F2A994; --motivation-a: #B5563D;
  --dreams-1: #EDE6F7; --dreams-2: #C9BAE8; --dreams-a: #7660AE;
  --gratitude-1: #FFF3DB; --gratitude-2: #F3D09F; --gratitude-a: #9C7430;
  --t1: var(--selfLove-1); --t2: var(--selfLove-2); --ta: var(--selfLove-a);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #241b20; --surface: rgba(255,255,255,.07); --surface-solid: #2f242a;
    --ink: #f5e4e2; --ink-soft: #c4a7aa; --line: rgba(245,228,226,.12);
    --rose: #e597a4; --rose-ink: #2a1d22; --shadow: rgba(0,0,0,.35);
    color-scheme: dark;
    --confidence-1: #423839; --confidence-2: #5f4946; --confidence-a: #d19c89;
    --productivity-1: #42393a; --productivity-2: #5c4c45; --productivity-a: #b99f83;
    --mindfulness-1: #3f393c; --mindfulness-2: #4f504e; --mindfulness-a: #90b09e;
    --selfLove-1: #42373b; --selfLove-2: #5e444c; --selfLove-a: #d194a2;
    --motivation-1: #423739; --motivation-2: #5e4340; --motivation-a: #cf9181;
    --dreams-1: #40373e; --dreams-2: #524858; --dreams-a: #a698ca;
    --gratitude-1: #43393a; --gratitude-2: #5e4e44; --gratitude-a: #bfa578;
  }
}
:root[data-theme="dark"] {
  --bg: #241b20; --surface: rgba(255,255,255,.07); --surface-solid: #2f242a;
  --ink: #f5e4e2; --ink-soft: #c4a7aa; --line: rgba(245,228,226,.12);
  --rose: #e597a4; --rose-ink: #2a1d22; --shadow: rgba(0,0,0,.35);
  color-scheme: dark;
    --confidence-1: #423839; --confidence-2: #5f4946; --confidence-a: #d19c89;
    --productivity-1: #42393a; --productivity-2: #5c4c45; --productivity-a: #b99f83;
    --mindfulness-1: #3f393c; --mindfulness-2: #4f504e; --mindfulness-a: #90b09e;
    --selfLove-1: #42373b; --selfLove-2: #5e444c; --selfLove-a: #d194a2;
    --motivation-1: #423739; --motivation-2: #5e4340; --motivation-a: #cf9181;
    --dreams-1: #40373e; --dreams-2: #524858; --dreams-a: #a698ca;
    --gratitude-1: #43393a; --gratitude-2: #5e4e44; --gratitude-a: #bfa578;
}

.th-confidence { --t1: var(--confidence-1); --t2: var(--confidence-2); --ta: var(--confidence-a); }
.th-productivity { --t1: var(--productivity-1); --t2: var(--productivity-2); --ta: var(--productivity-a); }
.th-mindfulness { --t1: var(--mindfulness-1); --t2: var(--mindfulness-2); --ta: var(--mindfulness-a); }
.th-selfLove { --t1: var(--selfLove-1); --t2: var(--selfLove-2); --ta: var(--selfLove-a); }
.th-motivation { --t1: var(--motivation-1); --t2: var(--motivation-2); --ta: var(--motivation-a); }
.th-dreams { --t1: var(--dreams-1); --t2: var(--dreams-2); --ta: var(--dreams-a); }
.th-gratitude { --t1: var(--gratitude-1); --t2: var(--gratitude-2); --ta: var(--gratitude-a); }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; border-radius: 12px; }

.app {
  position: relative;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  background: linear-gradient(160deg, var(--t1) 0%, var(--t2) 100%);
  transition: background .6s ease;
}
.screen {
  flex: 1;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 18px;
  box-sizing: border-box;
}
.view { display: flex; flex-direction: column; gap: 18px; flex: 1; }
h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 2.1rem;
  line-height: 1.1;
  margin: 8px 0 0;
  text-wrap: balance;
}
.lead { color: var(--ink-soft); margin: 0; line-height: 1.5; font-size: .95rem; }
.eyebrow {
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

/* Today */
.today-head { display: flex; flex-direction: column; gap: 4px; text-align: center; padding-top: 8px; }
.greet { font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; }
.date { color: var(--ink-soft); font-size: .9rem; }
.today-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; align-items: center; }
.card {
  width: 100%;
  box-sizing: border-box;
  background: var(--surface);
  border-radius: 32px;
  padding: 40px 28px 30px;
  box-shadow: 0 18px 40px -18px var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  text-align: center;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.card.enter { animation: rise .55s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { opacity: .2; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.theme-tag {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ta);
}
.theme-tag svg { width: 16px; height: 16px; }
.quote {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.9rem, 7.4vw, 2.5rem);
  line-height: 1.18;
  margin: 0;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.mark { color: var(--ta); font-size: .78rem; display: flex; align-items: center; gap: 6px; opacity: .8; }
.mark svg { width: 14px; height: 14px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.pill {
  border: 0;
  background: var(--surface);
  border-radius: 999px;
  padding: 12px 20px;
  font-weight: 600;
  font-size: .9rem;
  display: inline-flex; align-items: center; gap: 8px;
  box-shadow: 0 6px 18px -10px var(--shadow);
  transition: transform .15s ease, background .2s;
}
.pill:active { transform: scale(.97); }
.pill svg { width: 17px; height: 17px; }
.pill.primary { background: var(--rose); color: var(--rose-ink); }
.linkbtn { border: 0; background: none; color: var(--ink); font-weight: 600; font-size: .85rem; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg);
  padding: 10px 18px; border-radius: 999px; font-size: .85rem; font-weight: 600;
  z-index: 30;
}

/* Themes */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile {
  position: relative;
  border-radius: 24px;
  background: linear-gradient(150deg, var(--t1), var(--t2));
  min-height: 132px;
  box-shadow: 0 10px 26px -18px var(--shadow);
  transition: opacity .25s;
  display: flex;
}
.tile.off { opacity: .5; }
.tile-open {
  flex: 1; border: 0; background: none; text-align: left;
  display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  padding: 16px; border-radius: 24px; min-width: 0;
}
.tile-open svg { width: 24px; height: 24px; color: var(--ta); }
.tile-name { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; line-height: 1.1; }
.tile-count { font-size: .78rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.check {
  position: absolute; top: 10px; right: 10px;
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid var(--ta); background: transparent;
  display: grid; place-items: center; padding: 0; color: var(--surface-solid);
}
.check[aria-pressed="true"] { background: var(--ta); }
.check svg { width: 16px; height: 16px; opacity: 0; }
.check[aria-pressed="true"] svg { opacity: 1; }
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  background: var(--surface); border-radius: 20px; padding: 14px 16px;
}
.row label { font-weight: 600; min-width: 0; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .2s; }
.switch input:checked + span { background: var(--rose); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--rose); outline-offset: 3px; }

.back { align-self: flex-start; border: 0; background: var(--surface); border-radius: 999px; padding: 8px 14px 8px 10px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.back svg { width: 18px; height: 18px; }
.list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list li {
  background: var(--surface); border-radius: 18px; padding: 14px 16px;
  display: flex; gap: 12px; align-items: baseline;
}
.list li svg { width: 12px; height: 12px; color: var(--ta); flex: none; transform: translateY(1px); }
.list .txt { font-family: var(--font-display); font-size: 1.22rem; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }

/* Mine */
.empty { text-align: center; padding: 36px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--surface); border-radius: var(--radius); }
.empty svg { width: 44px; height: 44px; color: var(--rose); }
.empty p { margin: 0; }
.empty .big { font-family: var(--font-display); font-size: 1.45rem; font-weight: 600; }
.mine-item { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border-radius: 20px; padding: 16px; }
.mine-item .txt { font-family: var(--font-display); font-size: 1.25rem; line-height: 1.3; overflow-wrap: anywhere; }
.mine-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.mine-meta .theme-tag { font-size: .66rem; }
.mini { border: 0; background: none; color: var(--ink-soft); font-weight: 600; font-size: .82rem; padding: 4px 6px; }
.mini.danger { color: #b44a5c; }
.form { display: flex; flex-direction: column; gap: 12px; background: var(--surface); border-radius: var(--radius); padding: 18px; }
.form label { font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.form textarea {
  border: 1px solid var(--line); background: var(--surface-solid); border-radius: 16px;
  padding: 12px 14px; min-height: 96px; resize: vertical;
  font-family: var(--font-display); font-size: 1.3rem; line-height: 1.3;
}
.form .hint { font-size: .82rem; color: var(--ink-soft); margin: 0; line-height: 1.45; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid transparent; background: linear-gradient(150deg, var(--t1), var(--t2));
  border-radius: 999px; padding: 8px 12px; font-size: .82rem; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip svg { width: 14px; height: 14px; color: var(--ta); }
.chip[aria-pressed="true"] { border-color: var(--ta); }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; }

/* Settings */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 11px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--rose); color: var(--rose-ink); }
.section { display: flex; flex-direction: column; gap: 10px; }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; counter-reset: s; }
.steps li { background: var(--surface); border-radius: 18px; padding: 14px 16px 14px 52px; position: relative; line-height: 1.45; counter-increment: s; }
.steps li::before {
  content: counter(s); position: absolute; left: 14px; top: 13px;
  width: 26px; height: 26px; border-radius: 50%; background: var(--rose); color: var(--rose-ink);
  display: grid; place-items: center; font-size: .8rem; font-weight: 700;
}
.stat { display: flex; justify-content: space-between; background: var(--surface); border-radius: 18px; padding: 14px 16px; font-variant-numeric: tabular-nums; }
.stat b { font-weight: 700; }
.code-box { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border-radius: var(--radius); padding: 16px; }
.code-box p { margin: 0; line-height: 1.45; font-size: .9rem; }
.code-box textarea { border: 1px solid var(--line); background: var(--surface-solid); border-radius: 12px; padding: 10px; font-family: ui-monospace, Menlo, monospace; font-size: .72rem; min-height: 70px; }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface-solid);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.tabbar nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab {
  border: 0; background: none; padding: 9px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: .68rem; font-weight: 600; color: var(--ink-soft);
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--rose); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

</head>
<body>
<div class="app" id="app">
  <main class="screen" id="screen"></main>
  <div class="tabbar"><nav id="tabs" aria-label="Розділи"></nav></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return defaults();
    const s = Object.assign(defaults(), JSON.parse(raw));
    s.themes = s.themes.filter(t => THEMES.includes(t));
    s.custom = Array.isArray(s.custom) ? s.custom.filter(c => c && c.text && THEMES.includes(c.theme)) : [];
    return s;
  } catch (e) { return defaults(); }
}

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

/* ---------- Афірмація дня (той самий алгоритм у віджеті Scriptable) ---------- */
function fnv(str) {
  let h = 0xcbf29ce484222325n;
  for (const b of new TextEncoder().encode(str)) {
    h ^= BigInt(b);
    h = (h * 0x100000001b3n) & 0xffffffffffffffffn;
  }
  return h;
}
const hashCache = new Map();
const hashOf = (id) => { if (!hashCache.has(id)) hashCache.set(id, fnv(id)); return hashCache.get(id); };
function dayNumber(d) {
  const a = new Date(2024, 0, 1), b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.abs(Math.round((b - a) / 86400000));
}
function libFor(theme) {
  return LIB[theme].map((pair, i) => ({ id: `${theme}-${i}`, theme, text: pair[L()], custom: false }));
}
function customFor(theme) {
  return state.custom.filter(c => !theme || c.theme === theme).map(c => ({ id: `custom-${c.id}`, theme: c.theme, text: c.text, custom: true }));
}
function pool() {
  const themes = state.themes.length ? state.themes : THEMES;
  let list = [];
  THEMES.forEach(th => { if (themes.includes(th)) list = list.concat(libFor(th)); });
  if (state.includeCustom) list = list.concat(customFor());
  if (!list.length) list = libFor("selfLove");
  return list.sort((x, y) => { const a = hashOf(x.id), b = hashOf(y.id); return a < b ? -1 : a > b ? 1 : 0; });
}
const todayAff = () => { const p = pool(); return p[dayNumber(ui.now) % p.length]; };

/* ---------- Відмальовка ---------- */
const screen = document.getElementById("screen");
const app = document.getElementById("app");
const tabs = document.getElementById("tabs");

function setTint(theme) { app.className = "app th-" + theme; }

function greeting() {
  const h = ui.now.getHours();
  return h >= 5 && h < 12 ? t("morning") : h < 18 && h >= 12 ? t("afternoon") : t("evening");
}
function dateLabel() {
  try {
    const s = ui.now.toLocaleDateString(state.lang === "pl" ? "pl-PL" : "uk-UA", { weekday: "long", day: "numeric", month: "long" });
    return s.charAt(0).toUpperCase() + s.slice(1);
  } catch (e) { return ui.now.toDateString(); }
}

function renderTabs() {
  const items = [["today", "sun", "tabToday"], ["themes", "grid", "tabThemes"], ["mine", "heartText", "tabMine"], ["settings", "globe", "tabSettings"]];
  tabs.innerHTML = items.map(([id, ic, k]) =>
    `<button class="tab" data-tab="${id}" ${ui.tab === id ? 'aria-current="page"' : ""}>${svg(ic)}<span>${t(k)}</span></button>`).join("");
  document.documentElement.lang = state.lang;
}

function renderToday(animate) {
  const today = todayAff();
  const a = ui.shown || today;
  setTint(a.theme);
  screen.innerHTML = `
    <section class="view">
      <header class="today-head">
        <div class="greet">${greeting()}</div>
        <div class="date">${esc(dateLabel())}</div>
      </header>
      <div class="today-body">
        <div class="eyebrow">${ui.shown ? "&nbsp;" : t("ofDay")}</div>
        <article class="card${animate ? " enter" : ""}">
          <span class="theme-tag">${svg(a.theme)}${THEME_TITLES[a.theme][L()]}</span>
          <p class="quote">${esc(a.text)}</p>
          <span class="mark">${svg("selfLove")}${a.custom ? t("mine") : ""}</span>
        </article>
        <div class="actions">
          <button class="pill" data-act="another">${svg("shuffle")}${t("another")}</button>
          <button class="pill" data-act="share">${svg("share")}${t("share")}</button>
        </div>
        <button class="linkbtn" data-act="backToday" ${ui.shown ? "" : "hidden"}>${t("backToday")}</button>
      </div>
    </section>`;
}

function renderThemes() {
  setTint(ui.detail || "selfLove");
  if (ui.detail) {
    const th = ui.detail;
    const items = libFor(th).concat(customFor(th));
    const on = state.themes.includes(th);
    screen.innerHTML = `
      <section class="view">
        <button class="back" data-act="closeDetail">${svg("back")}${t("back")}</button>
        <h1>${THEME_TITLES[th][L()]}</h1>
        <div class="row"><label for="themeSwitch">${t("showTheme")}</label>
          <span class="switch"><input type="checkbox" id="themeSwitch" data-act="toggleTheme" data-theme-id="${th}" ${on ? "checked" : ""}><span></span></span></div>
        <ul class="list">${items.map(i => `<li>${svg(i.custom ? "selfLove" : "dot")}<span class="txt">${esc(i.text)}</span></li>`).join("")}</ul>
      </section>`;
    return;
  }
  screen.innerHTML = `
    <section class="view">
      <h1>${t("themesTitle")}</h1>
      <p class="lead">${t("themesLead")}</p>
      <div class="grid">${THEMES.map(th => {
        const on = state.themes.includes(th);
        const n = LIB[th].length + state.custom.filter(c => c.theme === th).length;
        return `<div class="tile th-${th}${on ? "" : " off"}">
          <button class="tile-open" data-act="openTheme" data-theme-id="${th}">${svg(th)}
            <span><span class="tile-name">${THEME_TITLES[th][L()]}</span><br><span class="tile-count">${n} ✦</span></span>
          </button>
          <button class="check" data-act="toggleTheme" data-theme-id="${th}" aria-pressed="${on}" aria-label="${t("showTheme")}: ${THEME_TITLES[th][L()]}">${svg("check")}</button>
        </div>`;
      }).join("")}</div>
      <div class="row"><label for="incCustom">${t("includeMine")}</label>
        <span class="switch"><input type="checkbox" id="incCustom" data-act="includeCustom" ${state.includeCustom ? "checked" : ""}><span></span></span></div>
    </section>`;
}

function formHTML() {
  const ed = ui.editing;
  return `
    <form class="form" id="mineForm">
      <div class="eyebrow">${ed.id ? t("editOne") : t("newOne")}</div>
      <label for="mineText">${t("text")}</label>
      <textarea id="mineText" maxlength="240" placeholder="${t("placeholder")}">${esc(ed.text)}</textarea>
      <p class="hint">${t("hint")}</p>
      <label>${t("theme")}</label>
      <div class="chips">${THEMES.map(th => `<button type="button" class="chip th-${th}" data-act="pickTheme" data-theme-id="${th}" aria-pressed="${ed.theme === th}">${svg(th)}${THEME_TITLES[th][L()]}</button>`).join("")}</div>
      <div class="form-actions">
        <button type="button" class="pill" data-act="cancelEdit">${t("cancel")}</button>
        <button type="submit" class="pill primary" id="saveBtn">${t("save")}</button>
      </div>
    </form>`;
}

function renderMine() {
  setTint(ui.editing ? ui.editing.theme : "selfLove");
  const list = state.custom.map(c => `
    <div class="mine-item th-${c.theme}">
      <div class="txt">${esc(c.text)}</div>
      <div class="mine-meta">
        <span class="theme-tag">${svg(c.theme)}${THEME_TITLES[c.theme][L()]}</span>
        ${ui.confirmDel === c.id
          ? `<span class="confirm">${t("sure")} <button class="mini danger" data-act="doDelete" data-id="${c.id}">${t("yes")}</button><button class="mini" data-act="noDelete">${t("cancel")}</button></span>`
          : `<span><button class="mini" data-act="editMine" data-id="${c.id}">${t("edit")}</button><button class="mini danger" data-act="askDelete" data-id="${c.id}">${t("del")}</button></span>`}
      </div>
    </div>`).join("");
  screen.innerHTML = `
    <section class="view">
      <h1>${t("mineTitle")}</h1>
      <p class="lead">${t("mineLead")}</p>
      ${ui.editing ? formHTML() : `<button class="pill primary" style="align-self:flex-start" data-act="newMine">${svg("plus")}${t("add")}</button>`}
      ${state.custom.length ? list : (ui.editing ? "" : `<div class="empty">${svg("heartText")}<p class="big">${t("emptyBig")}</p><p class="lead">${t("emptySmall")}</p></div>`)}
    </section>`;
  if (ui.editing) {
    const ta = document.getElementById("mineText");
    ta.addEventListener("input", () => { ui.editing.text = ta.value; });
  }
}

function exportCode() {
  return JSON.stringify({ afirmacji: 1, lang: state.lang, themes: state.themes, includeCustom: state.includeCustom, custom: state.custom.map(c => ({ id: c.id, text: c.text, theme: c.theme })) });
}

function renderSettings() {
  setTint("dreams");
  const total = THEMES.reduce((n, th) => n + LIB[th].length, 0);
  screen.innerHTML = `
    <section class="view">
      <h1>${t("settingsTitle")}</h1>
      <div class="section">
        <div class="seg" role="group" aria-label="${t("tabSettings")}">
          <button data-act="lang" data-lang="uk" aria-pressed="${state.lang === "uk"}">Українська</button>
          <button data-act="lang" data-lang="pl" aria-pressed="${state.lang === "pl"}">Polski</button>
        </div>
        <p class="lead">${t("langLead")}</p>
      </div>
      <div class="section">
        <div class="eyebrow">${t("homeTitle")}</div>
        <ol class="steps"><li>${t("home1")}</li><li>${t("home2")}</li><li>${t("home3")}</li><li>${t("home4")}</li></ol>
      </div>
      <div class="section">
        <div class="eyebrow">${t("widgetTitle")}</div>
        <div class="code-box">
          <p>${t("widgetLead")}</p>
          <textarea id="exportCode" readonly aria-label="${t("widgetTitle")}">${esc(exportCode())}</textarea>
          <button class="pill primary" style="align-self:flex-start" data-act="copyCode">${t("copyCode")}</button>
        </div>
      </div>
      <div class="section">
        <div class="stat"><span>${t("stats")}</span><b>${total}</b></div>
        <div class="stat"><span>${t("statsMine")}</span><b>${state.custom.length}</b></div>
      </div>
    </section>`;
}

function render(animate) {
  renderTabs();
  if (ui.tab === "today") renderToday(animate);
  else if (ui.tab === "themes") renderThemes();
  else if (ui.tab === "mine") renderMine();
  else renderSettings();
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 1800);
}
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); toast(t("copied")); }
  catch (e) { if (fallbackEl) { fallbackEl.focus(); fallbackEl.select(); } }
}

/* ---------- Дії ---------- */
function toggleTheme(th) {
  const i = state.themes.indexOf(th);
  if (i >= 0) state.themes.splice(i, 1); else state.themes.push(th);
  persist();
}

document.addEventListener("click", async (e) => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { ui.tab = tabBtn.dataset.tab; ui.detail = null; ui.confirmDel = null; render(); window.scrollTo(0, 0); return; }
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT") return;
  const act = el.dataset.act, th = el.dataset.themeId, id = el.dataset.id;
  switch (act) {
    case "another": {
      const cur = ui.shown || todayAff();
      const p = pool().filter(x => x.id !== cur.id);
      ui.shown = p.length ? p[Math.floor(Math.random() * p.length)] : null;
      render(true); break;
    }
    case "backToday": ui.shown = null; render(true); break;
    case "share": {
      const a = ui.shown || todayAff();
      if (navigator.share) { try { await navigator.share({ text: a.text }); break; } catch (err) { if (err && err.name === "AbortError") break; } }
      copyText(a.text); break;
    }
    case "openTheme": ui.detail = th; render(); window.scrollTo(0, 0); break;
    case "closeDetail": ui.detail = null; render(); break;
    case "toggleTheme": toggleTheme(th); render(); break;
    case "newMine": ui.editing = { id: null, text: "", theme: "selfLove" }; ui.confirmDel = null; render(); document.getElementById("mineText").focus(); break;
    case "editMine": { const c = state.custom.find(x => x.id === id); if (c) { ui.editing = { ...c }; ui.confirmDel = null; render(); window.scrollTo(0, 0); } break; }
    case "pickTheme": ui.editing.theme = th; render(); break;
    case "cancelEdit": ui.editing = null; render(); break;
    case "askDelete": ui.confirmDel = id; render(); break;
    case "noDelete": ui.confirmDel = null; render(); break;
    case "doDelete": state.custom = state.custom.filter(x => x.id !== id); ui.confirmDel = null; persist(); render(); break;
    case "lang": state.lang = el.dataset.lang; ui.shown = null; persist(); render(); break;
    case "copyCode": copyText(exportCode(), document.getElementById("exportCode")); break;
  }
});

document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.act === "toggleTheme") { toggleTheme(el.dataset.themeId); render(); }
  if (el.dataset.act === "includeCustom") { state.includeCustom = el.checked; persist(); render(); }
});

document.addEventListener("submit", (e) => {
  if (e.target.id !== "mineForm") return;
  e.preventDefault();
  const ed = ui.editing, text = (ed.text || "").trim();
  if (!text) { document.getElementById("mineText").focus(); return; }
  if (ed.id) {
    const c = state.custom.find(x => x.id === ed.id);
    if (c) { c.text = text; c.theme = ed.theme; }
  } else {
    state.custom.unshift({ id: uid(), text, theme: ed.theme, created: Date.now() });
  }
  ui.editing = null; persist(); render();
});

/* Нова афірмація опівночі та при поверненні на сторінку */
function refreshDay() {
  const before = dayNumber(ui.now);
  ui.now = new Date();
  if (dayNumber(ui.now) !== before) { ui.shown = null; }
  if (ui.tab === "today") render();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshDay(); });
function scheduleMidnight() {
  const n = new Date(), next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 5);
  setTimeout(() => { refreshDay(); scheduleMidnight(); }, next - n);
}
scheduleMidnight();

render(true);
})();
</script>

<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
</body>
</html>
